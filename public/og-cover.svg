<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Secutil</title>
  <desc id="desc">Local-first cybersecurity tools by domain</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062029" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="220" cy="120" r="140" fill="#10b981" opacity="0.22" filter="url(#blur)" />
  <circle cx="980" cy="90" r="160" fill="#06b6d4" opacity="0.2" filter="url(#blur)" />
  <circle cx="1010" cy="510" r="180" fill="#0ea5e9" opacity="0.15" filter="url(#blur)" />

  <g transform="translate(84 88)">
    <rect width="96" height="96" rx="20" fill="#0f172a" stroke="#34d399" stroke-opacity="0.7" />
    <path d="M48 14l26 9v22c0 20-13 32-26 39-13-7-26-19-26-39V23l26-9z" fill="url(#accent)" />
    <path d="M33 49l8 8 21-21" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="84" y="260" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700">
    Secutil
  </text>
  <text x="84" y="328" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="500">
    Local-first cybersecurity tools for SOC, threat intel, appsec, cloud IAM,
  </text>
  <text x="84" y="372" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="500">
    network exposure, supply chain, and privacy engineering workflows.
  </text>

  <g transform="translate(84 434)">
    <rect width="210" height="52" rx="26" fill="#0b1220" stroke="#334155" />
    <text x="26" y="34" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">75 Tools</text>
    <rect x="232" width="266" height="52" rx="26" fill="#0b1220" stroke="#334155" />
    <text x="258" y="34" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">7 Security Domains</text>
    <rect x="520" width="292" height="52" rx="26" fill="#0b1220" stroke="#334155" />
    <text x="546" y="34" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">Explicit Network Controls</text>
  </g>
